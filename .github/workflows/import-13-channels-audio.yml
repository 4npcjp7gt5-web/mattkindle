name: Import 13 Channels preview audio

on:
  push:
    branches:
      - 13-channels-player-preview
    paths:
      - album-audio-upload.zip

permissions:
  contents: write

jobs:
  import-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: 13-channels-player-preview
          persist-credentials: true

      - name: Extract and validate all 18 MP3 previews
        shell: bash
        run: |
          set -euo pipefail
          test -f album-audio-upload.zip
          mkdir -p public/audio/13-channels
          unzip -j -o album-audio-upload.zip 'audio/*.mp3' -d public/audio/13-channels
          test "$(find public/audio/13-channels -maxdepth 1 -name '*.mp3' | wc -l)" -eq 18
          for i in $(seq -w 1 18); do
            test -s "public/audio/13-channels/$i.mp3"
          done

      - name: Commit previews and remove upload ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/13-channels/
          git rm -f album-audio-upload.zip
          git diff --cached --quiet && exit 0
          git commit -m "Add all 18 30-second album preview MP3 files"
          git push origin HEAD:13-channels-player-preview
